[project]
name = "openclue-backend"
version = "1.0.0"
description = "Local AI, audio capture, transcription, and screen OCR backend for OpenClue."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "httpx>=0.27.2",
  "numpy>=1.26.4,<2.2.0",
  "sounddevice>=0.5.1",
  "pyaudiowpatch>=0.2.12.6; sys_platform == 'win32'",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
  "faster-whisper>=1.1.0",
  "mss>=9.0.2",
  "pillow>=10.4.0",
  "rapidocr-onnxruntime>=1.4.0",
  "onnxruntime>=1.19.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]
